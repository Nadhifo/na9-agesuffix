name: Build NA9AgeSuffix deb
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install ldid dpkg
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-path
          which ldid dpkg-deb
      - name: Build
        run: bash -x build.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NA9AgeSuffix
          path: |
            build/*.deb
            build/NA9AgeSuffix.dylib
